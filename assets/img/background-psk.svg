<!-- save as static/background-psk.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#071025"/>
    </linearGradient>

    <linearGradient id="g2" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0%" stop-color="#0ea5a4" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- small subtle noise -->
    <pattern id="dots" patternUnits="userSpaceOnUse" width="24" height="24">
      <circle cx="2" cy="2" r="0.9" fill="#ffffff" fill-opacity="0.02" />
    </pattern>
  </defs>

  <!-- base gradient -->
  <rect width="100%" height="100%" fill="url(#g1)"/>

  <!-- soft colored blobs -->
  <g filter="url(#blur)">
    <path d="M-200,300 C150,70 450,60 720,180 C980,290 1250,240 1600,380 L1600,1200 L-200,1200 Z"
          fill="url(#g2)" opacity="0.55"/>
    <path d="M1600,140 C1180,0 1000,80 700,120 C420,155 200,220 -200,60 L-200,1200 L1600,1200 Z"
          fill="#1f2937" opacity="0.45"/>
  </g>

  <!-- accent ribbon shapes -->
  <path d="M0,520 C180,430 340,520 600,470 C860,420 1050,510 1400,460 L1400,900 L0,900 Z"
        fill="#0f172a" opacity="0.28"/>

  <path d="M40,120 C220,70 380,120 620,80 C880,30 1060,100 1460,40 L1460,0 L40,0 Z"
        fill="#06202a" opacity="0.20"/>

  <!-- foreground organic outlines -->
  <g opacity="0.7">
    <path d="M1200,850 C980,760 820,820 620,780 C420,740 260,820 20,760 L20,900 L1600,900 L1600,820 Z"
          fill="#071025"/>
  </g>

  <!-- subtle dotted texture overlay -->
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- optional branded subtle watermark - replace text or remove -->
  <g transform="translate(36,840)" opacity="0.04" fill="#ffffff" font-family="sans-serif" font-size="26">
    <text>PSK</text>
  </g>
</svg>
