<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark navy gradient base -->
    <linearGradient id="bgBase" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0e1326"/>
      <stop offset="50%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#080d19"/>
    </linearGradient>

    <!-- Accent gradient for blobs -->
    <radialGradient id="accent1" cx="0.35" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <radialGradient id="accent2" cx="0.75" cy="0.75" r="0.9">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.40"/>
      <stop offset="80%" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Subtle grain texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>

    <!-- Blurred shapes -->
    <filter id="blur40">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#bgBase)"/>

  <!-- Abstract wave layers -->
  <g opacity="0.55" filter="url(#blur40)">
    <path d="M0,300 C300,120 650,140 950,260 C1250,380 1450,320 1600,420 L1600,900 L0,900 Z"
      fill="url(#accent1)"/>
  </g>

  <g opacity="0.50" filter="url(#blur40)">
    <path d="M0,150 C300,0 600,40 900,100 C1200,160 1450,60 1600,120 L1600,0 L0,0 Z"
      fill="url(#accent2)"/>
  </g>

  <!-- Foreground ribbon -->
  <path d="M0,650 C250,580 500,650 850,620 C1200,590 1450,650 1600,600 L1600,900 L0,900 Z"
    fill="#0c1429" opacity="0.30"/>

  <!-- Noise overlay -->
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.25"></rect>

  <!-- Very subtle watermark (remove if you want) -->
  <text x="40" y="860"
        fill="#ffffff"
        opacity="0.05"
        font-size="40"
        font-family="Inter, sans-serif">
      PSK
  </text>
</svg>
