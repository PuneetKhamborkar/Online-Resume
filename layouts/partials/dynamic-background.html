<div id="psk-bg"></div>

<style>
  /* ============================
     Base Container
  ============================= */
  #psk-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
    background: #0b0f1f;
  }

  /* ============================
     1) SOFT ANIMATED GRADIENT BACKGROUND
  ============================= */
  #psk-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        120deg,
        #1e1b4b,
        #312e81,
        #1e40af,
        #0ea5e9,
        #14b8a6,
        #7c3aed
      );
    background-size: 400% 400%;
    animation: psk-soft-gradient 18s ease infinite;
    opacity: 0.55;
  }

  @keyframes psk-soft-gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ============================
     2) FLOATING BLUR BLOBS
  ============================= */
  .psk-blob {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    animation: psk-float 16s infinite ease-in-out;
    mix-blend-mode: screen;
  }

  #psk-b1 { background: #7c3aed; top: 10%; left: 8%; animation-delay: 0s; }
  #psk-b2 { background: #14b8a6; top: 50%; left: 70%; animation-delay: -6s; }
  #psk-b3 { background: #ef4444; top: 70%; left: 25%; animation-delay: -10s; }

  @keyframes psk-float {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(60px, -40px) scale(1.3); }
    100% { transform: translate(0, 0) scale(1); }
  }

  /* ============================
     3) WAVY LAYERS
  ============================= */
  .psk-wave {
    position: absolute;
    width: 200%;
    height: 200px;
    left: -50%;
    opacity: 0.12;
    filter: blur(40px);
    background: radial-gradient(circle, #ffffff20, transparent 70%);
    animation: psk-wave-move 22s linear infinite;
  }

  #psk-w1 { top: 20%; animation-duration: 26s; }
  #psk-w2 { top: 55%; animation-duration: 32s; opacity: 0.1; }
  #psk-w3 { top: 80%; animation-duration: 40s; opacity: 0.08; }

  @keyframes psk-wave-move {
    0% { transform: translateX(-10%) translateY(0) scale(1); }
    50% { transform: translateX(10%) translateY(-20px) scale(1.1); }
    100% { transform: translateX(-10%) translateY(0) scale(1); }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const bg = document.getElementById("psk-bg");

    // Floating blobs
    ["psk-b1", "psk-b2", "psk-b3"].forEach(id => {
      const blob = document.createElement("div");
      blob.classList.add("psk-blob");
      blob.id = id;
      bg.appendChild(blob);
    });

    // Wavy layers
    ["psk-w1", "psk-w2", "psk-w3"].forEach(id => {
      const wave = document.createElement("div");
      wave.classList.add("psk-wave");
      wave.id = id;
      bg.appendChild(wave);
    });
  });
</script>
