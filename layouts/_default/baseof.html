<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" class="scroll-smooth antialiased">
<head>
    {{ partial "head.html" . }}
</head>

<body class="min-h-screen flex flex-col bg-transparent">

    <!-- Dynamic Background -->
    {{ partial "dynamic-background.html" . }}

    <!-- Header -->
    {{ partial "header.html" . }}

    <main class="flex-1">
        {{ block "main" . }}{{ end }}
    </main>

    <!-- Custom Footer (No Blowfish Credits) -->
    <footer class="py-6 text-center opacity-60 text-sm">
        {{ if .Site.Params.footer }}
            {{ .Site.Params.footer | safeHTML }}
        {{ else }}
            © {{ now.Format "2006" }} {{ .Site.Title }}
        {{ end }}
    </footer>

    <!-- Blowfish Scripts -->
    {{ partial "scripts.html" . }}
</body>
</html>
