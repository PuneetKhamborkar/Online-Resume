# ============================
# Markup Configuration (Blowfish)
# ============================

[goldmark]
  [goldmark.parser]
    attribute = true
    wrapStandAloneImageWithinParagraph = false

  [goldmark.renderer]
    unsafe = true

  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4

# ============================
# DISABLE PROSE SITE-WIDE
# ============================
[renderer]
  wrapInProse = false
